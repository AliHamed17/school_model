<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox Defender</title>
<style>
:root{--ink:#16181d;--mut:#5b6270;--bg:#f1f4f9;--line:#dfe5ee;--navy:#0f172a;--blue:#2563eb;--spam:#dc2626;--safe:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .brand{font-weight:800;font-size:19px}
.langs{display:flex;gap:6px}.langs button{background:transparent;border:1px solid #334155;color:#cbd5e1;padding:5px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}.langs button.on{background:#334155;color:#fff}
main{max-width:1080px;margin:0 auto;padding:14px 14px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 2px 10px rgba(15,23,42,.05);margin-bottom:14px}
h1{margin:0 0 4px;font-size:32px}h2{margin:0 0 6px;font-size:24px}h3{margin:12px 0 6px;font-size:17px}.sub{color:var(--mut);margin:0 0 8px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.st{flex:1;min-width:110px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:center;color:var(--mut)}
.st.on{border-color:var(--blue);color:var(--blue);background:#eff6ff}.st.done{border-color:#86efac;color:#166534;background:#f0fdf4}.st:disabled{opacity:.45;cursor:default}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;font-size:16px}.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}.btn.sm{padding:6px 12px;font-size:14px}.btn.spam{background:var(--spam)}.btn.safe{background:var(--safe)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.cols2{grid-template-columns:1fr}}
.col{border:2px solid var(--line);border-radius:14px;padding:8px 10px;max-height:380px;overflow:auto}.col.sp{border-color:#fecaca;background:#fff7f7}.col.sf{border-color:#bbf7d0;background:#f6fff9}
.col h3{margin:2px 0 6px;position:sticky;top:0;background:inherit}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:5px 0;font-size:14.5px}.msg.mine{border-color:var(--blue);background:#eff6ff}.tag{font-size:11px;color:var(--blue);font-weight:800}
textarea{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:64px}
.big{font-size:30px;font-weight:800}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:15px}.bar .w{width:96px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .t{flex:1;height:14px;border-radius:99px;background:#e8edf5;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:99px}.bar.sp i{background:var(--spam)}.bar.sf i{background:var(--safe)}
input[type=text]{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;width:220px}
.msgbig{font-size:21px;border:3px solid var(--line);border-radius:16px;padding:16px 18px;background:#fff;min-height:84px;margin:8px 0}
.chips span{display:inline-block;border-radius:8px;padding:1px 6px;margin:2px 1px;font-size:18px}
.gauge{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#bbf7d0,#fef9c3,#fecaca);margin:8px 0 2px;border:1px solid var(--line)}
.gauge .pin{position:absolute;top:-5px;width:6px;height:30px;background:var(--navy);border-radius:3px;transform:translateX(-3px)}.gauge .thp{position:absolute;top:-3px;width:3px;height:26px;background:#7c3aed;transform:translateX(-1px)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.verdict{border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:800;border:2px solid #cfe3f7;background:#f1f8ff}.verdict.ok{background:#effaf3;border-color:#b8e3c8}.verdict.no{background:#fdf0ef;border-color:#f1c2bf}
.pill{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:800;background:#eef2ff;margin-inline-end:6px}.pill.r{background:#fee2e2}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.mat div{border-radius:12px;padding:10px;text-align:center;font-weight:700;border:2px solid var(--line)}.mat .g{background:#f0fdf4;border-color:#86efac}.mat .b{background:#fef2f2;border-color:#fecaca}.mat b{display:block;font-size:28px}
.note{background:#fff8db;border:1px solid #ead887;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:15px}
.hp{height:16px;border-radius:99px;background:#fecaca;overflow:hidden;margin:6px 0}.hp i{display:block;height:100%;background:#16a34a}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.bd{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.45;filter:grayscale(1)}.bd.got{opacity:1;filter:none;border-color:#facc15;background:#fffbe6}.bd .e{font-size:32px}.bd b{display:block}.bd small{color:var(--mut)}
input[type=range]{width:100%}
</style></head>

 up today, wait near the front gate","Library books are due back next week, don't forget to return them","Thanks for helping me with the project, you explained it really well","Free pizza at the chess club lunch meeting on Wednesday, everyone welcome","Your art project looks amazing, the teacher wants to show it to the class","I will call you later, I am at my grandmother's house now","Class photo day is Monday, please wear your school uniform","Do you want to play online after homework, we can team up and win","The bus is late today, we will arrive at school at nine","Please read the story for English class and answer the three questions"],"spam_test":["Claim your free prize now, you are today's lucky winner, click here","Urgent notice: verify your account password or it will be blocked","Win free money fast, click the link and send your bank details","Free gift for you! Click now to get your new phone","Your parcel fee is unpaid, click the link to pay now","Make cash easily from home, click the secret link today","Congratulations winner, send your password to receive 500 dollars","Free followers and free skins, log in at this link now"],"safe_test":["The maths test is on Tuesday, please revise chapter five","Mum says dinner is ready, come home now","Can you bring your football boots to practice tomorrow","Happy birthday! See you at the party after school","The teacher said we have a free lesson, meet in the library","Thanks for sending the history notes, they were really helpful","Please sign the trip form and bring it on Friday","We can win the match if everyone comes to practice at five"],"tricky":[{"t":"FR33 g1ft c4rd!! cl1ck h3re n0w t0 cl4im y0ur pr1ze","y":1},{"t":"Dear student, kindly confirm your login details to keep your school account active","y":1},{"t":"Hello friend, a nice person left you some money, reply and we will explain","y":1},{"t":"URGENT: bring your PE kit today, we play to WIN the final!","y":0},{"t":"Free lesson now! Click Assignments in the school app to find the new room","y":0},{"t":"Congratulations on winning the maths prize, the school will send your certificate","y":0}]},"ar":{"spam_train":["أنت الفائز المحظوظ! اضغط على الرابط الآن لتستلم هاتفك المجاني","بطاقة هدية مجانية! اضغط هنا وأدخل كلمة المرور لتستلم جائزتك","عاجل: سيتم إغلاق حسابك. أكّد كلمة المرور الآن","اربح جهاز ألعاب مجاني اليوم، فقط اضغط على هذا الرابط","اكسب مالاً بسهولة وبسرعة من البيت بدون عمل، اضغط الآن","مبروك! ربحت ألف دولار. أرسل رقم حسابك البنكي لتستلمها","احصل على عشرة آلاف متابع مجانًا، اضغط الرابط وسجّل الدخول","تحذير أخير: أكّد كلمة المرور وإلا ستخسر حسابك اليوم","عرض محدود! قسائم بيتزا مجانية مدى الحياة، استلم جائزتك الآن","طردك بانتظارك، ادفع رسمًا صغيرًا عبر هذا الرابط لتستلمه","اضغط الآن واربح دراجة جديدة، الدخول مجاني، أسرع","جائزة خاصة لك، أرسل كلمة المرور إلى فريق الفائزين","اكسب المال بسرعة، ضاعف نقودك اليوم، اضغط الرابط السري","هاتفك فيه فيروس! اضغط هنا الآن لتنظيفه مجانًا","روبوكس مجاني وأشكال مجانية، اضغط الرابط وأدخل بيانات الدخول","عزيزي المستخدم، حسابك البنكي مقفل، أكّد الآن عبر هذا الرابط","تم اختيارك لرحلة مجانية، استلم جائزتك اليوم","عرض ساخن: أحذية رخيصة خصم تسعين بالمئة، اضغط الآن وادفع ببطاقة هدية","اربح تذاكر مجانية، اضغط الرابط، اليوم فقط، استلم الآن","بريدك ربح اليانصيب، أرسل كلمة المرور لتحصل على المال"],"safe_train":["واجب الرياضيات يُسلَّم يوم الخميس، أحضروا دفاتركم من فضلكم","ماما: العشاء الساعة السابعة، هل تشتري بعض الخبز في طريقك إلى البيت؟","تدريب كرة القدم نُقل إلى الساعة الخامسة بسبب المطر","عيد ميلاد سعيد يا دانا! سنأكل الكعكة بعد المدرسة اليوم","اختبار العلوم سيشمل الفصلين الثالث والرابع","هل يمكنك أن ترسل لي ملاحظات درس التاريخ من فضلك؟","عندنا حصة فراغ الآن، المعلم مريض، نلتقي في الغرفة اثنتي عشرة","مباراة رائعة أمس، نستطيع أن نربح المباراة القادمة إذا تدربنا","لا تنسَ أن تحضر ملابس الرياضة وزجاجة ماء غدًا","يجب توقيع إذن الرحلة المدرسية قبل يوم الجمعة","أبي سيأخذك اليوم، انتظر قرب البوابة الأمامية","كتب المكتبة يجب إعادتها الأسبوع القادم، لا تنسوا إرجاعها","شكرًا لأنك ساعدتني في المشر   const t = L(), e = evalAll(S.th), caught = (e.tp+e.fn)? e.tp/(e.tp+e.fn):0, fal = (e.fp+e.tn)? e.fp/(e.fp+e.tn):0, ok = caught >= 0.85 && fal <= 0.10;
  if (ok) S.mission = true;
  return `<div class="mat"><div class="g">${t.matrix[0]}<b>${e.tp}</b></div><div class="b">${t.matrix[1]}<b>${e.fp}</b></div><div class="b">${t.matrix[2]}<b>${e.fn}</b></div><div class="g">${t.matrix[3]}<b>${e.tn}</b></div></div>
   <div class="row" style="gap:28px"><div><div class="big" id="caughtv">${pct(caught)}%</div>${t.caught}</div><div><div class="big" id="falsev">${pct(fal)}%</div>${t.falseAl}</div></div>
   <div class="verdict ${ok?'ok':''}" style="margin-top:10px" id="missionv">${ok?t.missionOk:t.missionNo}</div><p class="sub" style="font-size:13px;margin-top:6px">${fmt(t.evalN,{n:e.n})}</p>`;
}
function v5() {
  const t = L();
  return `<div class="card"><h2>${t.h5}</h2><p class="sub">${t.p5}</p><div class="note" style="margin-top:0">${t.mission}</div>
   <p style="margin:12px 0 2px"><b id="thlabel">${fmt(t.th,{p:Math.round(S.th*100)})}</b></p><input type="range" id="thRange" min="5" max="99" value="${Math.round(S.th*100)}" oninput="setTh(this.value)">
   <div id="v5dyn">${v5dyn()}</div><div class="note">${t.trade}</div><div class="row"><button class="btn" id="btnNext" onclick="adv(6)">${t.next}</button></div></div>`;
}
function badgeFlags() { const a = S.test.filter((x,k)=>S.tAns[k]===x.y).length, b = S.test.filter(x=>(scoreMsg(S.model,x.t)>=0.5?1:0)===x.y).length;
  return [S.custom.length >= 2, S.searched > 0, S.tAns.length === S.test.length && a >= b, S.patches.length > 0, S.mission]; }
function v6() {
  const t = L(), a = S.test.filter((x,k)=>S.tAns[k]===x.y).length, b = S.test.filter(x=>(scoreMsg(S.model,x.t)>=0.5?1:0)===x.y).length, bossOk = S.tricky.filter(x=>(scoreMsg(trainModel([...baseTrain(), ...S.custom]),x.t)>=0.5?1:0)===x.y).length;
  const fl = badgeFlags();
  return `<div class="card"><h2>${t.h6}</h2><p class="sub">${t.p6}</p><div class="row" style="margin-top:0"><span class="pill">${fmt(t.scoreRace,{a,b,n:S.test.length})}</span><span class="pill r">${fmt(t.scoreBoss,{a:bossOk,t:S.tricky.length,p:S.patches.length})}</span></div>
   <h3>🏅 ${t.badgesH}</h3><div class="badges">${t.badges.map((g,i)=>`<div class="bd ${fl[i]?'got':''}"><div class="e">${g[0]}</div><b>${g[1]}</b><small>${g[2]}</small></div>`).join('')}</div>
   <h3>🤔 ${t.think}</h3><ul>${t.qs.map(q=>`<li>${q}</li>`).join('')}</ul>
   <div class="row"><button class="btn" id="btnCsv" onclick="downloadCsv()">⬇ ${t.dl}</button><button class="btn alt" onclick="reset();render()">↺ ${t.again}</button></div></div>`;
}
function render() {
  const t = L(); document.documentElement.lang = lang; document.documentElement.dir = t.dir; document.title = t.title; $('hb').textContent = t.brand;
  $('langs').innerHTML = Object.keys(T).map(k => `<button class="${k===lang?'on':''}" onclick="setLang('${k}')">${T[k].name}</button>`).join('');
  const body = { 1: v1, 2: v2, 3: () => raceCard('test'), 4: () => raceCard('boss'), 5: v5, 6: v6 }[S.lvl]();
  const intro = S.lvl === 1 ? `<div class="card"><h1>🛡️ ${t.title}</h1><p class="sub" style="font-size:17px;margin:0">${t.tag}</p></div>` : '';
  $('app').innerHTML = stepper() + intro + body;
}
function setLang(k) { lang = k; reset(); render(); }
function go(n) { if (n > S.max) return; if (n >= 2 && !S.model) train(); S.lvl = n; render(); window.scrollTo(0,0); }
function adv(n) { S.max = Math.max(S.max, n); go(n); }
function addOwn(y) { const el = $('own'), v = el.value.trim(); if (!v) return; S.custom.push({ t: v, y }); S.model = null; render(); }
function doTrain() { train(); render(); }
function searchWord() { S.q = $('wq').value.trim(); if (S.q) S.searched++; render(); }
function guess(y) { const round = S.lvl === 3 ? 'test' : 'boss'; if (round === 'test') { if (S.tShown) return; S.tAns[S.ti] = y; S.tShown = true; } else { if (S.bShown) return; S.bAns[S.bi] = y; S.bShown = true; } render(); }
function nextTest() { if (S.ti + 1 < S.test.length) { S.ti++; S.tShown = false; render(); } else { adv(4); } }
function nextBoss() { if (S.bi + 1 < S.tricky.length) { S.bi++; S.bShown = false; render(); } else { adv(5); } }
function patch() { const it = S.tricky[S.bi]; if (S.patches.some(x=>x.t===it.t)) return; S.patches.push({ t: it.t, y: it.y }); S.model = trainModel(allTrain()); render(); }
function setTh(v) { S.th = v/100; $('thlabel').textContent = fmt(L().th, { p: Math.round(S.th*100) }); $('v5dyn').innerHTML = v5dyn(); }
function downloadCsv() {
  const t = L(), th = S.th, e = evalAll(th), rows = [t.csv, ...e.rows.map(r => [r.t, r.y, Math.round(r.p*100), t.verdict[r.bl?0:1], (r.bl?1:0)===r.y?1:0])];
  const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const u = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); const a = document.createElement('a'); a.href = u; a.download = 'inbox_defender_results.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
window.Inbox = { S, go, addOwn, doTrain, searchWord, guess, nextTest, nextBoss, patch, setTh, evalAll, scoreMsg, trainModel, baseTrain, allTrain, downloadCsv, render, setLang, tok, M };
reset(); render();
</script>
