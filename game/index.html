<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human vs Robot</title>
<style>
:root{--ink:#16181d;--mut:#5b6270;--bg:#f4f6fb;--card:#fff;--line:#e3e7ef;--apple:#d9382b;--banana:#e7b800;--orange:#ee7f1a;--good:#1f9d57;--bad:#d64545;--brand:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{background:#111827;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px}
.langs{display:flex;gap:6px}
.langs button{background:transparent;border:1px solid #374151;color:#cbd2e0;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.langs button.on{background:#374151;color:#fff}
main{max-width:940px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 2px 10px rgba(20,24,40,.05)}
h1{margin:0 0 6px;font-size:40px;line-height:1.15}
h2{margin:0 0 4px;font-size:26px}
.sub{color:var(--mut);margin:0 0 18px;font-size:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:20px 0}
.step{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fafbff}
.step .em{font-size:34px}
.step b{display:block;font-size:19px;margin:4px 0}
.step span{color:var(--mut);font-size:15px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:14px 28px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{font-size:16px;padding:10px 18px;border-radius:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#d6dbe6}
.dot.done{background:var(--brand)}
.dot.now{background:#fff;border:3px solid var(--brand);width:14px;height:14px}
.score{display:flex;gap:10px;font-weight:700}
.pill{border-radius:999px;padding:6px 16px;font-size:17px;background:#eef0fb}
.pill.r{background:#fdecea}
.stage{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:26px;align-items:start}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.pic{width:100%;aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:#eee;display:block}
.fruits{display:grid;gap:12px}
.fb{display:flex;align-items:center;gap:14px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 18px;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);text-align:start}
.fb:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.fb .em{font-size:34px}
.fb .k{margin-inline-start:auto;font-size:14px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.fb.p0{border-color:#f3b4ae}.fb.p1{border-color:#f1dc84}.fb.p2{border-color:#f6c99b}
.fb.mine{outline:4px solid var(--brand)}
.fb:disabled{cursor:default;opacity:.85}
.reveal{margin-top:16px;border-radius:16px;padding:16px 18px;background:#f6f8ff;border:1px solid var(--line)}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.who{border-radius:14px;padding:12px 14px;background:#fff;border:2px solid var(--line)}
.who.ok{border-color:var(--good);background:#effaf3}
.who.no{border-color:var(--bad);background:#fdf0ef}
.who small{display:block;color:var(--mut);font-size:14px}
.who b{font-size:20px}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aab;vertical-align:middle;margin:0 4px}
.think{font-size:16px;color:#33384a}
.mem{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.mem div{text-align:center;font-weight:700;font-size:20px}
.mem .sw{width:86px;height:86px;display:block;margin:0 auto 8px;border:4px solid #fff;box-shadow:0 0 0 2px #aab}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:start}
th{background:#f4f6fb}
.big{font-size:56px;font-weight:800;line-height:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:16px 0}
.res{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fafbff}
.res h3{margin:0 0 8px;font-size:18px}
.res .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0}
.mis{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:#fff}
.mis img{width:84px;height:84px;border-radius:12px;flex:none}
ul.l{margin:6px 0 0;padding-inline-start:22px}
ul.l li{margin:6px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.note{background:#fff8db;border:1px solid #ead887;border-radius:14px;padding:12px 16px;margin-top:14px}
.banner{font-size:30px;font-weight:800;margin:4px 0 10px}
.hide{display:none}
.botrow{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.bot{font-size:58px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.bot.ok{animation:hop .6s ease}.bot.no{animation:shake .6s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.say{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700;font-size:17px}
.brain{margin-top:16px;border:2px dashed #c7d2fe;border-radius:16px;padding:10px 14px;background:#f7f8ff}
.brain h4{margin:0 0 6px;font-size:14px;color:#4338ca}
.brain .mem{margin:8px 0 2px;gap:16px}.brain .mem div{font-size:15px}.brain .mem .sw{width:44px;height:44px;border-width:3px;margin-bottom:4px}
.bars{margin:8px 0}.bar1{display:flex;align-items:center;gap:8px;font-size:14px;margin:3px 0}
.bar1 .t{flex:1;height:12px;border-radius:99px;background:#e7eaf3;overflow:hidden}.bar1 .t i{display:block;height:100%;border-radius:99px;background:#a5b4fc}
.bar1.pick .t i{background:var(--brand)}.bar1 span.l{width:96px}
.pill.f{background:#fff1d6;color:#9a4d00}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.badge1{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;text-align:center;opacity:.45;filter:grayscale(1)}
.badge1.got{opacity:1;filter:none;border-color:#facc15;background:#fffbe6;animation:hop .7s ease}
.badge1 .e{font-size:34px}.badge1 b{display:block;font-size:15px}.badge1 small{color:var(--mut)}
.cf{position:fixed;top:-30px;font-size:28px;pointer-events:none;z-index:50;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
</style></head>

  res:'תוצאות', testRes:'אדם נגד רובוט (12 תמונות)', trickRes:'סבב ההטעיה (4 תמונות)', acc:'דיוק',
  accNote:'דיוק = תשובות נכונות ÷ כל התמונות. בשלב 10 תחשבו ותציירו מספרים כאלה באקסל!',
  winYou:'ניצחתם את הרובוט! 🎉', winRobot:'הרובוט ניצח הפעם.', tie:'תיקו!',
  mistakes:'במה הרובוט טעה?', none:'בכלום — הפעם הרובוט צדק בהכול!',
  whyWrong:'הרובוט אמר “{r}” אבל התשובה הנכונה היא “{x}”. הרובוט מסתכל רק על צבע, ואתם רואים {clue}.',
  clue:['גבעול ועלה','צורה ארוכה ומעוקלת','צורה עגולה וקליפה מחוספסת'],
  learnt:'מה למדנו?', l1:'רובוט לומד מדוגמאות — הדוגמאות שאתם נתתם לו.', l2:'הרובוט הזה הסתכל רק על צבע. צבע לא מספיק: תפוח בצבע כתום מטעה אותו.', l3:'בינה מלאכותית טובה יותר רואה גם צורות ולומדת מהרבה יותר תמונות. זה מה ש-Teachable Machine עושה — וזה הבא!',
  dl:'הורדת התוצאות שלי (נפתח באקסל)', wrongBtn:'מלמדים את הרובוט לא נכון בכוונה', again:'משחקים שוב', back:'חזרה לדף ההורדות',
  exp:'ניסוי', expTxt:'נתנו לרובוט שמות לא נכונים (תפוח←בננה, בננה←תפוז, תפוז←תפוח). עכשיו הוא צדק ב-{n} מתוך 12. רובוט טוב רק כמו הדוגמאות שהוא לומד מהן!',
  csv:['סבב','תמונה','הפרי האמיתי','התשובה שלכם','תשובת הרובוט','צדקתם (1=כן)','הרובוט צדק (1=כן)'], rounds:['אדם נגד רובוט','הטעיה'], keyhint:'מקש',
  botThink:'הממ… אני מסתכל על הצבע…', botOk:['כן! צדקתי!','קלי קלות!','בום!'], botNo:['אופס… אני רואה רק צבע!','זה הטעה אותי!','הוטעיתי!'], botHi:'אני הרובוט שלכם. למדו אותי!',
  brain:'🧠 המוח של הרובוט עד עכשיו (צבעים ממוצעים)', brainEmpty:'ריק', closeness:'כמה קרוב כל זיכרון:', streak:'רצף', streakBig:'🔥 {n} ברצף!',
  badgesH:'התגים שלכם', badgeNew:'נפתח!', badges:[['🧠','מורה לרובוטים','לימדתם נכון את כל 9 התמונות'],['🏆','אדם מושלם','צדקתם בכל התמונות'],['🕵️','בלש צורות','ניצחתם את הרובוט בסבב ההטעיה'],['🔥','רצף חם','8 תשובות נכונות ברצף'],['🧪','מדען מטורף','לימדתם את הרובוט לא נכון בכוונה']] }
};
const EMOJI = ['🍎','🍌','🍊'];

// ---------------------------------------------------------------- state
const qs = new URLSearchParams(location.search);
let lang = qs.get('lang');
if (!T[lang]) { const nl = (navigator.language || 'en').toLowerCase(); lang = nl.startsWith('ar') ? 'ar' : (nl.startsWith('he') || nl.startsWith('iw')) ? 'he' : 'en'; }
let S;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function newGame() {
  S = { screen: 'start', i: 0, train: shuffle(DATA.train.slice()), test: shuffle(DATA.test.slice()), trick: shuffle(DATA.trick.slice()),
        labels: [], streak: 0, best: 0, mad: false, ans: { test: [], trick: [] }, rob: { test: [], trick: [] }, revealed: false, cent: null, exp: null };
}
newGame();

// ---------------------------------------------------------------- the robot: nearest average colour (a tiny machine-learning model)
function trainRobot(labels, items) {
  const sum = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], n = [0, 0, 0];
  items.forEach((im, k) => { const c = labels[k]; n[c]++; for (let j = 0; j < 3; j++) sum[c][j] += im.rgb[j]; });
  return sum.map((s, c) => n[c] ? s.map(v => v / n[c]) : null);
}
function robotGuess(cent, rgb) {
  let best = -1, bd = Infinity;
  cent.forEach((c, i) => { if (!c) return; const d = Math.hypot(rgb[0] - c[0], rgb[1] - c[1], rgb[2] - c[2]); if (d < bd) { bd = d; best = i; } });
  return best;
}

function robotDists(cent, rgb) { return cent.map(c => c ? Math.hypot(rgb[0] - c[0], rgb[1] - c[1], rgb[2] - c[2]) : null); }
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function confetti(n) {
  const em = ['🎉', '⭐', '🍎', '🍌', '🍊', '✨', '🤖'];
  for (let i = 0; i < (n || 36); i++) {
    const s = document.createElement('span'); s.className = 'cf'; s.textContent = pickOne(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = (Math.random() * 0.8) + 's'; s.style.fontSize = (20 + Math.random() * 22) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 3800);
  }
}
// ---------------------------------------------------------------- helpers
const L = () => T[lang];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
const sw = rgb => `<span class="sw" style="background:rgb(${rgb.map(Math.round).join(',')})"></span>`;
const dots = (n, cur) => '<div class="dots">' + Array.from({ length: n }, (_, k) => `<div class="dot ${k < cur ? 'done' : k === cur ? 'now' : ''}"></div>`).join('') + '</div>';
const sum = a => a.reduce((x, y) => x + y, 0);
function scores(round) {
  const items = S[round], a = S.ans[round], r = S.rob[round];
  return { you: sum(items.map((im, k) => a[k] === im.truth ? 1 : 0)), rob: sum(items.map((im, k) => r[k] === im.truth ? 1 : 0)), n: items.length };
}

// ---------------------------------------------------------------- screens
function fruitButtons(onclickName, chosen, locked) {
  const t = L();
  return '<div class="fruits">' + [0, 1, 2].map(c =>
    `<button class="fb p${c}${chosen === c ? ' mine' : ''}" ${locked ? 'disabled' : ''} onclick="${onclickName}(${c})"><span class="em">${EMOJI[c]}</span><span>${t.fruits[c]}</span><span class="k">${c + 1}</span></button>`).join('') + '</div>';
}
function viewStart() {
  const t = L();
  return `<div class="card"><h1>🤖 ${t.title}</h1><p class="sub">${t.tag}</p>
    <div class="steps">${t.how.map((h, k) => `<div class="step"><div class="em">${h[0]}</div><b>${k + 1}. ${h[1]}</b><span>${h[2]}</span></div>`).join('')}</div>
    <p class="sub" style="font-size:16px">${t.time}</p><button class="btn" onclick="go('teach')">${t.start} ▶</button></div>`;
}
function brainHtml(k, done) {
  const t = L(), upto = done ? k + 1 : k;
  const c = upto > 0 ? trainRobot(S.labels.slice(0, upto), S.train.slice(0, upto)) : [null, null, null];
  return `<div class="brain"><h4>${t.brain}</h4><div class="mem">${c.map((v, i) => `<div><span class="sw" style="background:${v ? `rgb(${v.map(Math.round)})` : '#e5e7eb'}"></span>${EMOJI[i]} ${v ? '' : t.brainEmpty}</div>`).join('')}</div></div>`;
}
function viewTeach() {
  const t = L(), k = S.i, im = S.train[k], done = S.revealed;
  const mine = S.labels[k];
  let fb = '';
  if (done) fb = mine === im.truth ? `<div class="reveal" style="background:#effaf3;border-color:#b8e3c8">✅ ${t.good}</div>` : `<div class="reveal" style="background:#fdf0ef;border-color:#f1c2bf">⚠️ ${fmt(t.oops, { x: t.fruits[im.truth] })}</div>`;
  return `<div class="card"><div class="bar"><div><h2>${t.s1}</h2><div class="sub" style="margin:0;font-size:16px">${t.s1sub}</div></div>${dots(S.train.length, k)}</div>
    <div class="botrow"><span class="bot ${done ? (mine === im.truth ? 'ok' : 'no') : ''}">${done ? (mine === im.truth ? '🤩' : '🤨') : '🤖'}</span><span class="say">${done ? (mine === im.truth ? pickOne(t.botOk) : pickOne(t.botNo)) : t.botHi}</span></div>
    <div class="stage"><div><img class="pic" src="${im.file}" alt=""><div class="sub" style="text-align:center;margin:8px 0 0;font-size:15px">${fmt(t.pic, { n: k + 1, t: S.train.length })}</div></div>
    <div>${fruitButtons('teachAns', done ? mine : -1, done)}${fb}${brainHtml(k, done)}${done ? `<div class="actions"><button class="btn" onclick="teachNext()">${t.next} ▶</button></div>` : ''}</div></div></div>`;
}
function viewLearned() {
  const t = L();
  return `<div class="card"><h2>🧠 ${t.learned}</h2><p class="sub">${t.learned2}</p>
    <div class="mem">${S.cent.map((c, i) => `<div><span class="sw" style="background:${c ? `rgb(${c.map(Math.round)})` : '#ddd'}"></span>${EMOJI[i]} ${t.fruits[i]}</div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick="go('test')">${t.toTest} ▶</button></div></div>`;
}
function viewQuiz(round) {
  const t = L(), items = S[round], k = S.i, im = items[k], total = items.length;
  const sc = scores(round), shown = S.revealed ? k + 1 : k;
  const a = S.ans[round][k], r = S.rob[round][k];
  let reveal = '';
  if (S.revealed) {
    const yok = a === im.truth, rok = r === im.truth, cr = S.cent[r];
    reveal = `<div class="reveal"><div class="row3">
        <div class="who ok"><small>${t.real}</small><b>${EMOJI[im.truth]} ${t.fruits[im.truth]}</b></div>
        <div class="who ${yok ? 'ok' : 'no'}"><small>${t.you}</small><b>${yok ? '✅' : '❌'} ${EMOJI[a]} ${t.fruits[a]}</b></div>
        <div class="who ${rok ? 'ok' : 'no'}"><small>${t.robot}</small><b>${rok ? '✅' : '❌'} ${EMOJI[r]} ${t.fruits[r]}</b></div></div>
      <div class="think"><b>${t.think}</b> ${fmt(t.thinkTxt, { sw: sw(im.rgb), c: t.fruits[r], sw2: sw(cr) })}</div>
      ${barsHtml(im, r)}<div class="actions"><button class="btn" onclick="quizNext('${round}')">${k + 1 < total ? t.next : (round === 'test' ? t.toTrick : t.toRes)} ▶</button></div></div>`;
  }
  const done = S.revealed;
  return `<div class="card"><div class="bar"><div><h2>${round === 'test' ? t.s2 : t.s3}</h2><div class="sub" style="margin:0;font-size:16px">${round === 'test' ? t.s2sub : t.s3sub}</div></div>
      <div class="score">${S.streak >= 2 ? `<span class="pill f">${fmt(t.streakBig, { n: S.streak })}</span>` : ''}<span class="pill">${t.you} ${sc.you}</span><span class="pill r">${t.robot} ${sc.rob}</span></div></div>
    <div class="bar">${dots(total, k)}<span class="sub" style="margin:0;font-size:15px">${fmt(t.pic, { n: k + 1, t: total })}</span></div>
    <div class="botrow"><span class="bot ${S.revealed ? (r === im.truth ? 'ok' : 'no') : ''}">${S.revealed ? (r === im.truth ? '😎' : '😵') : '🤖'}</span><span class="say">${S.revealed ? pickOne(r === im.truth ? t.botOk : t.botNo) : t.botThink}</span></div>
    <div class="stage"><div><img class="pic" src="${im.file}" alt=""></div><div>${fruitButtons('quizAns', done ? a : -1, done)}${reveal}</div></div></div>`;
}
function barsHtml(im, r) {
  const t = L(), d = robotDists(S.cent, im.rgb), mx = Math.max(...d.filter(x => x != null));
  return `<div class="bars"><div class="think"><b>${t.closeness}</b></div>` + d.map((v, i) => v == null ? '' :
    `<div class="bar1 ${i === r ? 'pick' : ''}"><span class="l">${EMOJI[i]} ${t.fruits[i]}</span><span class="t"><i style="width:${Math.max(6, Math.round(100 * (1 - v / (mx * 1.08))))}%"></i></span></div>`).join('') + '</div>';
}
function badgeList() {
  const a = scores('test'), b = scores('trick');
  const taught = S.labels.every((c, k) => c === S.train[k].truth);
  return [taught, a.you === a.n && b.you === b.n, b.you > b.rob, S.best >= 8, S.mad];
}
function accPct(x, n) { return Math.round(100 * x / n) + '%'; }
function viewResults() {
  const t = L(), a = scores('test'), b = scores('trick');
  const head = a.you > a.rob ? t.winYou : a.you < a.rob ? t.winRobot : t.tie;
  const miss = [];
  ['test', 'trick'].forEach(round => S[round].forEach((im, k) => { if (S.rob[round][k] !== im.truth) miss.push({ im, r: S.rob[round][k] }); }));
  const missHtml = miss.length ? miss.map(m => `<div class="mis"><img src="${m.im.file}" alt=""><div>${fmt(t.whyWrong, { r: t.fruits[m.r], x: t.fruits[m.im.truth], clue: t.clue[m.im.truth] })}</div></div>`).join('') : `<p>${t.none}</p>`;
  const exp = S.exp != null ? `<div class="note"><b>🧪 ${t.exp}:</b> ${fmt(t.expTxt, { n: S.exp })}</div>` : '';
  const back = location.protocol.startsWith('http') ? `<a class="btn alt sm" href="../${lang === 'en' ? 'index' : 'index-' + lang}.html">${t.back}</a>` : '';
  return `<div class="card"><div class="banner">${head}</div>
    <div class="cols">
      <div class="res"><h3>${t.testRes}</h3><div class="line"><span>${t.you}</span><b class="big">${a.you}/${a.n}</b></div><div class="line"><span>${t.acc}</span><b>${accPct(a.you, a.n)}</b></div>
        <hr style="border:0;border-top:1px solid var(--line)"><div class="line"><span>${t.robot}</span><b class="big">${a.rob}/${a.n}</b></div><div class="line"><span>${t.acc}</span><b>${accPct(a.rob, a.n)}</b></div></div>
      <div class="res"><h3>${t.trickRes}</h3><div class="line"><span>${t.you}</span><b class="big">${b.you}/${b.n}</b></div><div class="line"><span>${t.acc}</span><b>${accPct(b.you, b.n)}</b></div>
        <hr style="border:0;border-top:1px solid var(--line)"><div class="line"><span>${t.robot}</span><b class="big">${b.rob}/${b.n}</b></div><div class="line"><span>${t.acc}</span><b>${accPct(b.rob, b.n)}</b></div></div></div>
    <p class="sub" style="font-size:15px">${t.accNote}</p>
    <h2>${t.mistakes}</h2>${missHtml}
    <h2 style="margin-top:20px">🏅 ${t.badgesH}</h2><div class="badges">${badgeList().map((g, i) => `<div class="badge1 ${g ? 'got' : ''}"><div class="e">${t.badges[i][0]}</div><b>${t.badges[i][1]}</b><small>${t.badges[i][2]}</small></div>`).join('')}</div>
    <h2 style="margin-top:20px">💡 ${t.learnt}</h2><ul class="l"><li>${t.l1}</li><li>${t.l2}</li><li>${t.l3}</li></ul>${exp}
    <div class="actions"><button class="btn sm" onclick="downloadCsv()">⬇ ${t.dl}</button><button class="btn alt sm" onclick="wrongExperiment()">🧪 ${t.wrongBtn}</button><button class="btn alt sm" onclick="newGame();go('start')">↺ ${t.again}</button>${back}</div></div>`;
}

// ---------------------------------------------------------------- actions
function render() {
  const t = L();
  document.documentElement.lang = lang; document.documentElement.dir = t.dir; document.title = t.title;
  document.getElementById('hb').textContent = t.brand;
  document.getElementById('langs').innerHTML = Object.keys(T).map(k => `<button class="${k === lang ? 'on' : ''}" onclick="setLang('${k}')">${T[k].name}</button>`).join('');
  const v = { start: viewStart, teach: viewTeach, learned: viewLearned, test: () => viewQuiz('test'), trick: () => viewQuiz('trick'), results: viewResults }[S.screen];
  document.getElementById('app').innerHTML = v();
  if (S.screen === 'results' && !S.cf) { S.cf = true; const a = scores('test'); if (a.you >= a.rob) confetti(44); }
  window.scrollTo(0, 0);
}
function setLang(k) { lang = k; render(); }
function go(screen) { S.screen = screen; S.i = 0; S.revealed = false; render(); }
function teachAns(c) { if (S.revealed) return; S.labels[S.i] = c; S.revealed = true; render(); }
function teachNext() {
  if (S.i + 1 < S.train.length) { S.i++; S.revealed = false; render(); } else { S.cent = trainRobot(S.labels, S.train); go('learned'); }
}
function quizAns(c) {
  if (S.revealed) return;
  const round = S.screen, im = S[round][S.i];
  S.ans[round][S.i] = c; S.rob[round][S.i] = robotGuess(S.cent, im.rgb); S.revealed = true;
  if (c === im.truth) { S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
  render(); if (c === im.truth && (S.streak === 5 || S.streak === 8 || S.streak === 12)) confetti(18);
}
function quizNext(round) {
  if (S.i + 1 < S[round].length) { S.i++; S.revealed = false; render(); }
  else go(round === 'test' ? 'trick' : 'results');
}
function wrongExperiment() {
  const wrongLabels = S.labels.map(c => (c + 1) % 3);
  const cent = trainRobot(wrongLabels, S.train);
  S.exp = sum(S.test.map(im => robotGuess(cent, im.rgb) === im.truth ? 1 : 0)); S.mad = true;
  render();
}
function downloadCsv() {
  const t = L(), rows = [t.csv];
  ['test', 'trick'].forEach((round, ri) => S[round].forEach((im, k) => {
    const a = S.ans[round][k], r = S.rob[round][k];
    rows.push([t.rounds[ri], k + 1, t.fruits[im.truth], t.fruits[a], t.fruits[r], a === im.truth ? 1 : 0, r === im.truth ? 1 : 0]);
  }));
  const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'human_vs_robot_results.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.addEventListener('keydown', e => {
  if (['1', '2', '3'].includes(e.key)) {
    const c = +e.key - 1;
    if (S.screen === 'teach') teachAns(c); else if (S.screen === 'test' || S.screen === 'trick') quizAns(c);
  } else if (e.key === 'Enter' || e.key === ' ') {
    if (e.target && e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (S.screen === 'start') go('teach');
    else if (S.screen === 'teach' && S.revealed) teachNext();
    else if (S.screen === 'learned') go('test');
    else if ((S.screen === 'test' || S.screen === 'trick') && S.revealed) quizNext(S.screen);
  }
});
render();
</script>
</body></html>
