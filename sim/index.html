<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detective Map</title>
<style>
:root{--ink:#16181d;--mut:#5b6270;--bg:#f2f6fb;--line:#dfe6f0;--brand:#0f766e;--good:#1f9d57;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{background:#0b3b3a;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .brand{font-weight:800;font-size:19px}
.langs{display:flex;gap:6px}.langs button{background:transparent;border:1px solid #2f6f6c;color:#c9ecea;padding:5px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}.langs button.on{background:#2f6f6c;color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,40,60,.05);margin-bottom:14px}
h1{margin:0 0 4px;font-size:32px}h2{margin:0 0 6px;font-size:20px}.sub{color:var(--mut);margin:0 0 8px}
.layout{display:grid;grid-template-columns:minmax(320px,540px) 1fr;gap:14px;align-items:start}@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static!important}}
.sticky{position:sticky;top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;font-size:16px}.chip.on{border-color:var(--brand);background:#ecfdf9;color:#064e4b}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;font-size:15px}.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}.btn.sm{padding:6px 12px;font-size:14px}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.mapwrap{position:relative;width:100%;aspect-ratio:520/440;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fbfdff}
canvas#bg,svg#map{position:absolute;inset:0;width:100%;height:100%}
svg#map text{font-family:inherit}
.dot{transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s}
.dot circle{stroke:#fff;stroke-width:1.5}
.dot.hi circle{stroke:#111;stroke-width:3}
#star{transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:grab}
#star.drag{transition:none;cursor:grabbing}
.tip{position:fixed;z-index:30;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none;display:none;font-size:13px;width:150px;text-align:center}
.tip .p{width:100px;height:100px;margin:0 auto}.tip .p img,.tip .p svg{width:100%;height:100%;border-radius:8px}
select{font:inherit;font-size:14px;border:2px solid var(--line);border-radius:8px;padding:3px 6px;max-width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px}
.stepno{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-inline-end:8px}
.stepno.done{background:var(--good)}
.gal{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.gal button{border:3px solid var(--line);border-radius:12px;background:#fff;padding:2px;cursor:pointer;width:62px;height:62px}.gal button.on{border-color:var(--brand)}
.gal button img,.gal button svg{width:100%;height:100%;border-radius:8px;display:block}
.pic{width:130px;height:130px;border-radius:14px;border:1px solid var(--line);overflow:hidden;flex:none}.pic img,.pic svg{width:100%;height:100%;display:block}
.cols{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.gauge{margin:5px 0;font-size:14px}.gauge .b{height:10px;border-radius:99px;background:#e6edf5;overflow:hidden;margin-top:2px}.gauge .b i{display:block;height:100%;background:var(--brand)}.gauge b{font-size:16px}
.mos{display:grid;grid-template-columns:repeat(8,26px);gap:1px;margin-top:8px}.mos div{width:26px;height:26px;cursor:crosshair;border-radius:3px}
.vote{display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:700}.vote .t{flex:1;height:16px;border-radius:99px;background:#e6edf5;overflow:hidden}.vote .t i{display:block;height:100%}
.verdict{border-radius:14px;padding:10px 14px;margin-top:8px;font-size:18px;font-weight:800;background:#f1f8ff;border:2px solid #cfe3f7}.verdict.ok{background:#effaf3;border-color:#b8e3c8}.verdict.no{background:#fdf0ef;border-color:#f1c2bf}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:start}th{background:#f1f6fb}tr.pick{cursor:pointer}tr.pick:hover{background:#f1fbf8}tr.best td{font-weight:800;color:#065f46}tr.cur td{background:#ecfdf9}
.note{background:#fff8db;border:1px solid #ead887;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:15px}
.big{font-size:30px;font-weight:800}
.sl{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;font-size:14px;margin:3px 0}.sl input{width:100%}
.chal div{border:2px dashed #99d6cf;border-radius:12px;padding:8px 10px;margin:6px 0;background:#f4fffd}
.wrongs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
</style></head>

let lang = qs.get('lang'); if (!T[lang]) { const n = (navigator.language||'en').toLowerCase(); lang = n.startsWith('ar')?'ar':(n.startsWith('he')||n.startsWith('iw'))?'he':'en'; }

const Y = v => H-PAD - (v - range(S.ay)[0]) / (range(S.ay)[1]-range(S.ay)[0]) * (H-PAD-12);

// ---------------------------------------------------------------- drawn pets (the picture is built from the clue numbers)
function petSvg(f) {
  const [e, s, d, ey] = f, p = e/10, fur = `hsl(28,38%,${80 - d*6}%)`, dark = `hsl(28,38%,${58 - d*5}%)`, light = `hsl(28,45%,${Math.min(92, 88 - d*3)}%)`;
  const ax = 8 + 16*p, ay = 70 - 66*p, er = 2.6 + ey*0.55;
  const ear = (x) => `<polygon points="${x?100-22:22},40 ${x?100-44:44},28 ${x?100-ax:ax},${ay}" fill="${dark}" stroke="${dark}" stroke-width="7" stroke-linejoin="round"/>`;
  const my = 66 + s*0.6, ry = 5 + s*1.5, rx = 9 + s*0.5;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#eef7ff"/>${ear(0)}${ear(1)}
   <circle cx="50" cy="58" r="32" fill="${fur}"/><ellipse cx="50" cy="${my}" rx="${rx}" ry="${ry}" fill="${light}"/>
   <circle cx="38" cy="52" r="${er}" fill="#fff"/><circle cx="62" cy="52" r="${er}" fill="#fff"/><circle cx="38" cy="52" r="${er*0.55}" fill="#222"/><circle cx="62" cy="52" r="${er*0.55}" fill="#222"/>
   <ellipse cx="50" cy="${my-ry+4}" rx="4.5" ry="3.2" fill="#2b2b2b"/></svg>`;
}
const pic = it => S.ds === 'fruit' ? `<img src="${it.img}" alt="">` : petSvg(it.f);

// ---------------------------------------------------------------- the AI: k nearest dots on the chosen two clues
function nearest(f, k, ax, ay) {
  const rx = range(ax), ry = range(ay), tr = D().train;
  const ds = tr.map((t,i) => ({ i, d: Math.hypot((f[ax]-t.f[ax])/(rx[1]-rx[0]), (f[ay]-t.f[ay])/(ry[1]-ry[0])) })).sort((a,b) => a.d - b.d).slice(0,k);
  const votes = new Array(L().cls[S.ds].length).fill(0); ds.forEach(x => votes[tr[x.i].c]++);
  return { nn: ds.map(x => x.i), votes, top: votes.indexOf(Math.max(...votes)) };
}
function evalSet(list, ax, ay, k) {
  const wrong = []; let ok = 0; list.forEach((t,i) => { const r = nearest(t.f, k, ax, ay); if (r.top === t.c) ok++; else wrong.push(i); }); return { ok, n: list.length, wrong };
}

}

// ---------------------------------------------------------------- the map
function buildMap() {
  const svg = $('map'); let h = '';
  const rx = range(S.ax), ry = range(S.ay), t = L();
  h += `<rect x="${PAD}" y="12" width="${W-PAD-12}" height="${H-PAD-12}" fill="none" stroke="#c9d6e4"/>`;
  for (let i=0;i<=4;i++) { const vx = rx[0]+(rx[1]-rx[0])*i/4, vy = ry[0]+(ry[1]-ry[0])*i/4; h += `<text x="${X(vx)}" y="${H-PAD+14}" font-size="11" fill="#6b7686" text-anchor="middle">${Math.round(vx*10)/10}</text><text x="${PAD-5}" y="${Y(vy)+4}" font-size="11" fill="#6b7686" text-anchor="end">${Math.round(vy*10)/10}</text>`; }
  h += `<text x="${PAD+(W-PAD-12)/2}" y="${H-6}" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">${t.feats[S.ds][S.ax]}</text>`;
  h += `<text transform="translate(11,${12+(H-PAD-12)/2}) rotate(-90)" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">${t.feats[S.ds][S.ay]}</text>`;
  h += `<g id="lines"></g>`;
  D().train.forEach((tr,i) => { h += `<g class="dot" data-i="${i}" style="transform:translate(${W/2}px,-20px);opacity:0"><circle r="6.5" fill="${COLORS[S.ds][tr.c]}"/></g>`; });
  h += `<g id="star" style="transform:translate(${W/2}px,-40px);opacity:0"><text font-size="30" text-anchor="middle" y="9" style="paint-order:stroke;stroke:#fff;stroke-width:4px">⭐</text></g>`;

}
function placeAll(initial) {

    g.style.transform = vis ? `translate(${X(tr.f[S.ax])}px,${Y(tr.f[S.ay])}px)` : g.style.transform; g.style.opacity = vis ? 1 : 0; });
  if (S.star) placeStar();

}
function buildMapKeep(keep) { // rebuild axis text but keep dots (so they glide to their new places)
  const svg = $('map'), dots = [...svg.querySelectorAll('.dot')], star = $('star'), lines = $('lines');
  const rx = range(S.ax), ry = range(S.ay), t = L(); svg.querySelectorAll('text:not(#star text),rect').forEach(n => n.remove());
  let h = `<rect x="${PAD}" y="12" width="${W-PAD-12}" height="${H-PAD-12}" fill="none" stroke="#c9d6e4"/>`;
  for (let i=0;i<=4;i++) { const vx = rx[0]+(rx[1]-rx[0])*i/4, vy = ry[0]+(ry[1]-ry[0])*i/4; h += `<text x="${X(vx)}" y="${H-PAD+14}" font-size="11" fill="#6b7686" text-anchor="middle">${Math.round(vx*10)/10}</text><text x="${PAD-5}" y="${Y(vy)+4}" font-size="11" fill="#6b7686" text-anchor="end">${Math.round(vy*10)/10}</text>`; }
  h += `<text x="${PAD+(W-PAD-12)/2}" y="${H-6}" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">${t.feats[S.ds][S.ax]}</text><text transform="translate(11,${12+(H-PAD-12)/2}) rotate(-90)" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">${t.feats[S.ds][S.ay]}</text>`;
  svg.insertAdjacentHTML('afterbegin', h);
}
function showTip(i, e) { const tr = D().train[i], t = L(), tip = $('tip');
  tip.innerHTML = `<div class="p">${pic(tr)}</div><b>${t.emo[S.ds][tr.c]} ${t.cls[S.ds][tr.c]}</b><br>${t.featShort[S.ds][S.ax]}: ${tr.f[S.ax]}<br>${t.featShort[S.ds][S.ay]}: ${tr.f[S.ay]}`; tip.style.display = 'block'; moveTip(e); }
function moveTip(e) { const tip = $('tip'); tip.style.left = Math.min(innerWidth-170, e.clientX+14)+'px'; tip.style.top = Math.min(innerHeight-190, e.clientY+14)+'px'; }
function drawBrain() {
  const cv = $('bg'); if (!cv) return; const g = cv.getContext('2d'); g.clearRect(0,0,W,H); if (!S.brain || !S.trained) return;
  const step = 8, cols = COLORS[S.ds];
  for (let x = PAD; x < W-12; x += step) for (let y = 12; y < H-PAD; y += step) {
    const f = new Array(nF()).fill(0); f[S.ax] = invX(x+step/2); f[S.ay] = invY(y+step/2);
    g.fillStyle = cols[nearest(f, S.k, S.ax, S.ay).top] + '55'; g.fillRect(x, y, step, step); }
}
function trainAnim(instant) {
  if (S.timer) clearInterval(S.timer); const n = D().train.length;
  const step = () => { S.shown++; placeAll(true); const c = document.querySelector('.dot[data-i="'+(S.shown-1)+'"]'); drawSteps(true);
    if (S.shown >= n) { clearInterval(S.timer); S.trained = true; $('hint').textContent=''; updateBrainBtn(); drawSteps(); } };
  if (instant) { S.shown = n; S.trained = true; placeAll(true); updateBrainBtn(); drawSteps(); $('hint').textContent=''; return; }
  S.shown = 0; S.trained = false; S.brain = false; drawBrain(); document.querySelectorAll('.dot').forEach(g => { g.style.transition='none'; g.style.transform=`translate(${W/2}px,-20px)`; g.style.opacity=0; }); void document.body.offsetWidth; document.querySelectorAll('.dot').forEach(g => g.style.transition='');
  S.timer = setInterval(step, 28);
}

// ---------------------------------------------------------------- the star (test picture)
function setStar(item, label) { S.star = { f: item.f.slice(), c: item.c, item, moved: false, custom: !!item.custom }; const g = $('star'); g.style.transition = 'none'; g.style.transform = `translate(${W/2}px,-40px)`; g.style.opacity = 0; void g.getBoundingClientRect(); g.style.transition = ''; placeStar(); updateStar(true); }
function placeStar() { const g = $('star'); if (!g || !S.star) return; g.style.opacity = 1; g.style.transform = `translate(${X(S.star.f[S.ax])}px,${Y(S.star.f[S.ay])}px)`; }
function updateStar() { if (!S.trained || !S.star) { drawSteps(); return; } const r = nearest(S.star.f, S.k, S.ax, S.ay); S.star.r = r;
  const dots = document.querySelectorAll('.dot'); dots.forEach(d => d.classList.remove('hi')); r.nn.forEach(i => dots[i].classList.add('hi'));
  $('lines').innerHTML = r.nn.map(i => { const tr = D().train[i]; return `<line x1="${X(S.star.f[S.ax])}" y1="${Y(S.star.f[S.ay])}" x2="${X(tr.f[S.ax])}" y2="${Y(tr.f[S.ay])}" stroke="${COLORS[S.ds][tr.c]}" stroke-width="2.5" stroke-dasharray="5 4"/>`; }).join('');
  drawSteps(); }
function setupDrag() {
  const svg = $('map'), g = $('star'); let id = null;
  const toData = e => { const r = svg.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
  g.addEventListener('pointerdown', e => { if (!S.star) return; id = e.pointerId; g.setPointerCapture(id); g.classList.add('drag'); e.preventDefault(); });
  g.addEventListener('pointermove', e => { if (id !== e.pointerId) return; const [px, py] = toData(e); const rx = range(S.ax), ry = range(S.ay);
    S.star.f[S.ax] = Math.max(rx[0], Math.min(rx[1], invX(px))); S.star.f[S.ay] = Math.max(ry[0], Math.min(ry[1], invY(py))); S.star.moved = true; placeStar(); updateStar(); });
  g.addEventListener('pointerup', () => { id = null; g.classList.remove('drag'); });
}

// ---------------------------------------------------------------- steps column
function gauges(f) { const t = L(); return f.map((v,i) => { const r = range(i); return `<div class="gauge">${t.feats[S.ds][i]}: <b>${Math.round(v*10)/10}</b><div class="b"><i style="width:${Math.max(3,Math.min(100,(v-r[0])/(r[1]-r[0])*100))}%"></i></div></div>`; }).join(''); }
function drawSteps(light) {
  const t = L(), d = D(), el = $('steps'); if (!el) return;
  if (light && el.dataset.keep) { const c = el.querySelector('#trainmsg'); if (c) c.textContent = fmt(t.trained,{n:S.shown}).replace(' ✔',''); return; }
  const cur = d.train[S.sel % d.train.length], gal = [...Array(8)].map((_,i) => (S.galOff*8 + i*11) % d.train.length);
  const done = [true, S.trained, S.star && S.trained, S.brain, !!S.easy];
  const mine = S.ds === 'pets' ? `<div class="note"><b>${t.mine}</b>${[0,1,2,3].map(i=>`<div class="sl"><span>${t.featShort.pets[i]}</span><input type="range" min="0" max="10" step="0.1" value="${S.mine[i]}" oninput="setMine(${i},+this.value)"><span id="mv${i}">${S.mine[i]}</span></div>`).join('')}<div class="pic" id="minepic" style="margin-top:6px">${petSvg(S.mine)}</div></div>` : '';
  let pix = '';
  if (S.ds === 'fruit') pix = `<div class="row"><button class="btn alt sm" onclick="S.zoom=!S.zoom;drawSteps()">${S.zoom?t.zoomOff:t.zoom}</button></div>` + (S.zoom ? `<p class="sub" style="font-size:14px;margin-top:6px">${t.pixP}</p><div class="mos">${Array.from({length:64},(_,i)=>{const m=cur.mos; return `<div style="background:rgb(${m[i*3]},${m[i*3+1]},${m[i*3+2]})" onmouseenter="document.getElementById('pxv').textContent='${fmt(t.pixV,{r:cur.mos[i*3],g:cur.mos[i*3+1],b:cur.mos[i*3+2]})}'"></div>`;}).join('')}</div><div class="note" id="pxv">—</div>` : '');
  // step 3 content
  let s3 = '';
  if (!S.trained) s3 = `<div class="note">${t.needTrain}</div>`;
  else {
    const pool = d.test, thumbs = pool.map((it,i) => `<button class="${S.star&&S.star.item===it?'on':''}" onclick="pickTest(${i})">${pic(it)}</button>`).join('');
    s3 = `<div class="gal">${thumbs}</div><div class="row"><button class="btn sm" onclick="surprise()">${t.surprise}</button>${S.ds==='pets'?`<button class="btn alt sm" onclick="testMine()">${t.useMine}</button>`:''}</div>`;
    if (S.star && S.star.r) {
      const r = S.star.r, cl = t.cls[S.ds], em = t.emo[S.ds], k = S.k, truthKnown = !S.star.custom && !S.star.moved, ok = r.top === S.star.c;
      s3 += `<div class="cols" style="margin-top:10px">${S.star.moved||S.star.custom&&0?'':`<div class="pic">${pic(S.star.item)}</div>`}<div style="flex:1;min-width:200px">${cl.map((c,i)=>`<div class="vote"><span style="width:96px">${em[i]} ${c}</span><span class="t"><i style="width:${r.votes[i]/k*100}%;background:${COLORS[S.ds][i]}"></i></span><span>${r.votes[i]}</span></div>`).join('')}</div></div>
        <div class="verdict ${truthKnown?(ok?'ok':'no'):''}">${t.says}: ${em[r.top]} ${cl[r.top]} <small>(${fmt(t.of,{a:r.votes[r.top],k})})</small>${truthKnown?`<br><small>${t.truth}: ${em[S.star.c]} ${cl[S.star.c]} — ${ok?'✅ '+t.right:'❌ '+t.wrong}</small>`:`<br><small>${S.star.custom?t.noTruth:t.moved}</small>`}</div>`;
    }
  }
  // step 5
  let s5 = '';
  if (S.trained) {
    const e = S.easy, x = S.tricky, nfe = nF(), pairs = [];
    for (let a=0;a<nfe;a++) for (let b=a+1;b<nfe;b++) { const r = evalSet(d.test, a, b, S.k); pairs.push({a,b,acc:r.ok/r.n}); }
    const best = Math.max(...pairs.map(p=>p.acc));
    const wr = (res, list) => res && res.wrong.length ? `<div class="wrongs">${res.wrong.map(i=>`<button class="btn alt sm" style="padding:2px;width:58px;height:58px" onclick="inspect('${list}',${i})"><span class="pic" style="width:100%;height:100%;display:block">${pic(d[list][i])}</span></button>`).join('')}</div>` : (res ? `<p>${t.none}</p>` : '');
    s5 = `<div class="row"><button class="btn sm" onclick="runEval('easy')">${t.runEasy}</button><button class="btn alt sm" onclick="runEval('tricky')">${t.runTricky}</button></div>
      <div class="row" style="gap:24px">${e?`<div><div class="big">${Math.round(100*e.ok/e.n)}%</div>${t.easy}: ${e.ok}/${e.n}</div>`:''}${x?`<div><div class="big">${Math.round(100*x.ok/x.n)}%</div>${t.tricky}: ${x.ok}/${x.n}</div>`:''}</div>
      ${(e||x)?`<p class="sub" style="margin-top:8px">${t.wrongH}</p>${wr(e,'test')}${wr(x,'tricky')}`:''}
      <h2 style="margin-top:14px;font-size:17px">${t.pairs}</h2><p class="sub" style="font-size:14px">${t.pairsP}</p>
      <table>${pairs.map(p=>`<tr class="pick ${p.acc===best?'best':''} ${p.a===S.ax&&p.b===S.ay||p.a===S.ay&&p.b===S.ax?'cur':''}" onclick="setAxes(${p.a},${p.b})"><td>${t.featShort[S.ds][p.a]} + ${t.featShort[S.ds][p.b]}</td><td>${Math.round(p.acc*100)}%</td><td><span style="display:inline-block;height:10px;width:${p.acc*140}px;background:var(--brand);border-radius:99px"></span></td></tr>`).join('')}</table>`;
  } else s5 = `<div class="note">${t.needTrain}</div>`;
  el.dataset.keep = 1;
  el.innerHTML = `
  <div class="card"><h2><span class="stepno ${done[0]?'done':''}">1</span>${t.s1}</h2><p class="sub">${t.s1p}</p>
    <div class="gal">${gal.map(i=>`<button class="${i===S.sel?'on':''}" onclick="S.sel=${i};drawSteps()">${pic(d.train[i])}</button>`).join('')}<button onclick="S.galOff++;S.sel=(S.galOff*8)%${d.train.length};drawSteps()" title="${t.another}" style="font-size:22px">🔄</button></div>
    <div class="cols"><div class="pic">${pic(cur)}</div><div style="flex:1;min-width:220px"><b>${t.emo[S.ds][cur.c]} ${t.cls[S.ds][cur.c]}</b>${gauges(cur.f)}</div></div>${pix}${mine}</div>
  <div class="card"><h2><span class="stepno ${done[1]?'done':''}">2</span>${t.s2}</h2><p class="sub">${t.s2p}</p>
    <div class="row"><button class="btn" onclick="trainAnim()">${S.trained?t.retrain:t.train}</button><b id="trainmsg">${S.trained?fmt(t.trained,{n:d.train.length}):''}</b></div></div>
  <div class="card"><h2><span class="stepno ${done[2]?'done':''}">3</span>${t.s3}</h2><p class="sub">${t.s3p}</p>${s3}</div>
  <div class="card"><h2><span class="stepno ${done[3]?'done':''}">4</span>${t.s4}</h2><p class="sub">${t.s4p}</p><div class="row"><button class="btn sm" onclick="toggleBrain()" ${S.trained?'':'disabled'}>🧠 ${S.brain?t.brainOn:t.brain}</button></div><p class="sub" style="margin-top:8px"><b>${t.kq}</b></p></div>
  <div class="card"><h2><span class="stepno ${done[4]?'done':''}">5</span>${t.s5}</h2><p class="sub">${t.s5p}</p>${s5}</div>
  <div class="card"><h2>🎯 ${t.chH}</h2><div class="chal">${t.ch.map(c=>`<div>${c}</div>`).join('')}</div></div>`;
  updateBrainBtn();
}
function setMine(i, v) { S.mine[i] = v; document.getElementById('mv'+i).textContent = v; document.getElementById('minepic').innerHTML = petSvg(S.mine); }
function pickTest(i) { setStar(D().test[i]); }
function surprise() { const pool = [...D().test, ...D().tricky]; setStar(pool[Math.floor(Math.random()*pool.length)]); }
function testMine() { setStar({ f: S.mine.slice(), c: -1, custom: true }); }
function runEval(which) { S[which] = evalSet(D()[which === 'easy' ? 'test' : 'tricky'], S.ax, S.ay, S.k); drawSteps(); }
function inspect(list, i) { setStar(D()[list][i]); window.scrollTo({ top: 0, behavior: 'smooth' }); }
window.Sim = { S, setDs, setAxes, setK, trainAnim, pickTest, setStar, evalSet, nearest, toggleBrain, runEval, testMine, D };
render();
</script>
