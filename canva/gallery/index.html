<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class gallery | AI Classroom</title>
<meta name="description" content="Websites the class built with AI.">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;--ink:#152432;--sub:#566575;--border:#dbe3ea;--bg:#f5f8fb;--accent:#086fa9;--accent-ink:#fff;--warn-bg:#fff6e5;--warn-border:#f0d49a;--bad-bg:#fdecec;--bad-border:#f0b4b4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,44px) 16px 60px}
header{text-align:center;margin-bottom:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800}
h1{font-size:clamp(26px,4.5vw,40px);letter-spacing:-.03em;margin:6px 0 8px;line-height:1.15}
.lead{color:var(--sub);font-size:clamp(15px,2vw,17px);margin:0 auto;max-width:700px}
.sub{color:var(--sub);font-size:13px}
nav.top{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{border-color:#9db3c4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid #0b78b1;outline-offset:2px}
.notice{max-width:820px;margin:0 auto 16px;padding:12px 16px;border-radius:12px;border:1px solid var(--warn-border);background:var(--warn-bg)}
.notice.bad{background:var(--bad-bg);border-color:var(--bad-border)}
.notice p{margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{font:inherit;text-align:left;background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:140px;transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover{border-color:#0b78b1;box-shadow:0 8px 20px #12365017;transform:translateY(-2px)}
.card .num{align-self:flex-start;background:#e7f5fd;color:var(--accent);font-weight:800;font-size:12px;border-radius:99px;padding:2px 10px}
.card .t{font-size:18px;font-weight:760;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .by{color:var(--sub);font-size:14px;margin-top:auto}
.card .go{color:var(--accent);font-weight:700;font-size:14px}
.empty{background:#fff;border:1px dashed var(--border);border-radius:16px;padding:36px 20px;text-align:center;color:var(--sub)}
#viewer{position:fixed;inset:0;background:#0a233acc;z-index:10;display:flex;flex-direction:column;padding:12px}
#viewer .head{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px 12px 0 0;padding:10px 14px;flex-wrap:wrap}
#viewer .head .t{font-weight:700;flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .body{flex:1;background:#fff;border-radius:0 0 12px 12px;overflow:hidden}
#viewer iframe{width:100%;height:100%;border:0;background:#fff;display:block}
#viewer .msg{display:grid;place-items:center;height:100%;color:var(--sub);padding:20px;text-align:center}
footer{font-size:13px;color:var(--sub);margin-top:26px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">AI &amp; Machine Learning · Classroom Activity</div>
    <h1>Class gallery</h1>
    <p class="lead">Websites our class built with AI. Click one to open it.</p>
    <nav class="top"><a class="btn" id="navMain" href="#">← My Canva design</a><a class="btn primary" id="navStudio" href="#">AI Website Studio</a></nav>
  </header>

  <div id="note" class="notice" hidden><p id="noteText"></p></div>
  <div class="bar"><strong id="count">Loading…</strong><span class="sub" id="updated"></span></div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <footer>Websites are written by AI from student prompts, and the AI can make mistakes. Your teacher can hide any website.</footer>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Student website" hidden>
  <div class="head">
    <span class="t" id="vTitle"></span>
    <button type="button" class="btn small" id="vCopy">Copy link</button>
    <button type="button" class="btn small primary" id="vClose">Close</button>
  </div>
  <div class="body" id="vBody"></div>
</div>

<script>window.CLASSROOM_CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbzhE3qrCU0pCMTOwBQt4Agp4ho2HMBN5L8-UiFyK9n53Q-46b-HvBEfU7crK4obe-RR7A/exec" };</script>
<script>
(() => {
  'use strict';
  const CFG = window.CLASSROOM_CONFIG || {};
  const API = String(CFG.API_URL || '').trim();
  const configured =
    /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec$/.test(API) ||
    /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(API);
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ROOT = location.pathname.replace(/gallery\/?$/, '');
  $('navMain').href = ROOT;
  $('navStudio').href = ROOT + 'studio/';

  let token = null;
  try { token = localStorage.getItem('canvaSeatToken'); } catch (_) {}

  async function get(params) {
    const url = new URL(API);
    for (const [k, v] of Object.entries(params)) if (v != null) url.searchParams.set(k, v);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const res = await fetch(url, { redirect: 'follow', cache: 'no-store', signal: ctl.signal });
      const text = await res.text();
      try { return JSON.parse(text); } catch (_) { return { ok: false, error: 'bad_response' }; }
    } catch (_) { return { ok: false, error: 'network' }; }
    finally { clearTimeout(timer); }
  }
  const transient = (r) => !r.ok && (r.error === 'network' || r.error === 'busy' || r.error === 'server' || String(r.error).startsWith('bad_response'));
  async function retrying(fn, tries = 4) {
    let r;
    for (let i = 0; i < tries; i++) {
      r = await fn();
      if (!transient(r)) return r;
      if (i < tries - 1) await sleep(1200 * 2 ** i + Math.random() * 1200);
    }
    return r;
  }

  // A student's page runs in a sandbox with no network, no navigation, no popups and no access to this site.
  const CSP = "default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; media-src data:; base-uri 'none'; form-action 'none'";
  function srcdocFor(html, image) {
    let h = String(html).replace(/<!doctype[^>]*>/i, '');
    if (image) h = h.split('{{IMAGE}}').join(image);
    return '<!doctype html><meta http-equiv="Content-Security-Policy" content="' + CSP + '">' + h;
  }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (!isFinite(s)) return '';
    if (s < 90) return 'just now';
    if (s < 5400) return Math.round(s / 60) + ' min ago';
    if (s < 129600) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  }

  let sites = [];
  function render() {
    const grid = $('grid');
    grid.textContent = '';
    if (!sites.length) {
      const d = document.createElement('div'); d.className = 'empty'; d.style.gridColumn = '1/-1';
      d.textContent = 'No websites yet. Be the first: open the AI Website Studio!';
      grid.appendChild(d);
    }
    for (const s of sites.slice().sort((a, b) => String(b.updated).localeCompare(String(a.updated)))) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'card';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = 'Computer ' + s.seat;
      const t = document.createElement('span'); t.className = 't'; t.dir = 'auto'; t.textContent = s.title;
      const by = document.createElement('span'); by.className = 'by'; by.dir = 'auto'; by.textContent = 'by ' + s.name + (s.updated ? ' · ' + ago(s.updated) : '');
      const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Open website →';
      b.append(num, t, by, go);
      b.addEventListener('click', () => openSite(s.seat));
      grid.appendChild(b);
    }
    $('count').textContent = sites.length === 1 ? '1 website' : sites.length + ' websites';
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function loadGallery() {
    const g = await retrying(() => get({ action: 'gallery' }));
    if (!g.ok) {
      $('count').textContent = '';
      $('noteText').textContent = g.error === 'unknown_action' ? 'The gallery is not installed on the class server yet. Ask your teacher.' : 'Could not reach the class server. Please reload the page.';
      $('note').className = 'notice bad'; $('note').hidden = false;
      return;
    }
    sites = g.sites;
    if (!g.enabled) { $('noteText').textContent = 'The studio is paused by your teacher. You can still look at the websites.'; $('note').hidden = false; }
    render();
  }

  // ---- viewer ----
  let openSeat = 0;
  async function openSite(seat) {
    openSeat = seat;
    const v = $('viewer'), body = $('vBody');
    v.hidden = false;
    body.textContent = '';
    const m = document.createElement('div'); m.className = 'msg'; m.textContent = 'Loading…'; body.appendChild(m);
    $('vTitle').textContent = 'Computer ' + seat;
    history.replaceState(null, '', '?site=' + seat);
    const s = await retrying(() => get({ action: 'site', seat, token }));
    if (openSeat !== seat) return;
    body.textContent = '';
    if (!s.ok) {
      const d = document.createElement('div'); d.className = 'msg';
      d.textContent = s.error === 'hidden' ? 'This website is hidden by the teacher.' : s.error === 'no_site' ? 'There is no website for this computer yet.' : 'Could not load this website.';
      body.appendChild(d);
      return;
    }
    $('vTitle').textContent = s.title + ' · by ' + s.name + ' (Computer ' + seat + ')';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.setAttribute('title', s.title);
    f.srcdoc = srcdocFor(s.html, s.image);
    body.appendChild(f);
    $('vClose').focus();
  }
  function closeViewer() {
    $('viewer').hidden = true; $('vBody').textContent = ''; openSeat = 0;
    history.replaceState(null, '', location.pathname);
  }
  $('vClose').addEventListener('click', closeViewer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });
  $('vCopy').addEventListener('click', async () => {
    const link = new URL(location.pathname + '?site=' + openSeat, location.href).href;
    try { await navigator.clipboard.writeText(link); $('vCopy').textContent = 'Copied ✓'; } catch (_) { $('vCopy').textContent = 'Press Ctrl+C on the address bar'; }
    setTimeout(() => { $('vCopy').textContent = 'Copy link'; }, 2200);
  });

  // ---- start ----
  async function boot() {
    if (!configured) { $('noteText').textContent = 'This page is not connected to the class server yet.'; $('note').className = 'notice bad'; $('note').hidden = false; $('count').textContent = ''; return; }
    const want = parseInt(new URLSearchParams(location.search).get('site'), 10);
    if (want >= 1 && want <= 50) openSite(want);
    await loadGallery();
    setInterval(() => { if (!document.hidden && $('viewer').hidden) loadGallery(); }, 45000);
  }
  boot();
})();
</script>
</body>
</html>
